name: Optimize BTC ZigZag Spot Strategy

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/optimize_btc_strategy.py"
      - ".github/workflows/optimize-btc-strategy.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Download / refresh BTC 1m data
        run: python scripts/download_btc_1m.py

      - name: Run optimizer
        run: python scripts/optimize_btc_strategy.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: btc-strategy-optimization
          path: results/top_setups.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/top_setups.csv
          git diff --cached --quiet || git commit -m "results: optimize BTC spot strategy"
          git push
